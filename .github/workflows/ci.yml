name: CI

on:
  push:
    branches: [main]
    paths:
      - 'ZipValidatorClassLib/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - run: dotnet build

      - uses: github/codeql-action/analyze@v4

  vuln-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    needs: codeql

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore

      - run: dotnet list package --vulnerable --include-transitive

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: vuln-check
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj

      - run: dotnet build ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj --no-restore --configuration Release

      - run: >
          dotnet test ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~HugeECTD"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit Test Results
          path: TestResults/test-results.trx
          reporter: dotnet-trx

  publish:
    name: Build & Publish NuGet
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet build ZipValidatorClassLib/ZipValidatorClassLib.csproj --configuration Release

      - run: >
          dotnet nuget push ZipValidatorClassLib/bin/Release/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' ZipValidatorClassLib/ZipValidatorClassLib.csproj)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.value }} already exists, skipping"
          else
            git tag v${{ steps.version.outputs.value }}
            git push origin v${{ steps.version.outputs.value }}
          fi
