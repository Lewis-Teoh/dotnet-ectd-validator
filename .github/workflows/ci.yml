name: CI

on:
  push:
    branches: [main]
    paths:
      - 'ZipValidatorClassLib/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - run: dotnet build

      - uses: github/codeql-action/analyze@v4

  vuln-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    needs: codeql

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore

      - run: dotnet list package --vulnerable --include-transitive

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: vuln-check
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj

      - run: dotnet build ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj --no-restore --configuration Release

      - run: >
          dotnet test ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~HugeECTD"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit Test Results
          path: TestResults/test-results.trx
          reporter: dotnet-trx

  publish:
    name: Build & Publish NuGet
    runs-on: ubuntu-latest
    needs: [codeql, vuln-check, test]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.codeql.result == 'success' &&
      needs['vuln-check'].result == 'success' &&
      needs.test.result == 'success'
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet build ZipValidatorClassLib/ZipValidatorClassLib.csproj --configuration Release

      - run: >
          dotnet nuget push ZipValidatorClassLib/bin/Release/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' ZipValidatorClassLib/ZipValidatorClassLib.csproj)
          TAG="v$VERSION"
          if gh api repos/${{ github.repository }}/git/refs/tags/$TAG >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            gh api repos/${{ github.repository }}/git/refs \
              --method POST \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
            echo "Created tag $TAG"
          fi
