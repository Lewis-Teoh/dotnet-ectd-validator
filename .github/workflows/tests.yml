name: ZipValidatorClassLib Tests

on:
  push:
    paths:
      - 'ZipValidatorClassLib/**'
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      - name: Build
        run: dotnet build ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test ZipValidatorClassLib.Tests/ZipValidatorClassLib.Tests.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~HugeECTD"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit Test Results
          path: TestResults/test-results.trx
          reporter: dotnet-trx
