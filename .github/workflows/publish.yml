name: Publish NuGet Package

on:
  push:
    branches: [main]
    paths:
      - 'ZipValidatorClassLib/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack
        run: dotnet build ZipValidatorClassLib/ZipValidatorClassLib.csproj --configuration Release

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push ZipValidatorClassLib/bin/Release/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
