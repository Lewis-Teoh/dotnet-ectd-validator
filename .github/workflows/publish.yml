name: Publish NuGet Package

on:
  push:
    branches: [main]
    paths:
      - 'ZipValidatorClassLib/**'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack
        run: dotnet build ZipValidatorClassLib/ZipValidatorClassLib.csproj --configuration Release

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push ZipValidatorClassLib/bin/Release/*.nupkg
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ZipValidatorClassLib/bin/Release/*.nupkg
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
